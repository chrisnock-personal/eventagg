[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ── PostgreSQL ────────────────────────────────────────────────────────────────
; __PG_BIN__ is replaced at container start by entrypoint.sh with the
; distro-correct path (e.g. /usr/lib/postgresql/16/bin or /usr/pgsql-16/bin)
[program:postgres]
command=__PG_BIN__/postgres -D /var/lib/postgresql/data
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/postgres.log
stdout_logfile_maxbytes=5MB
stderr_logfile=/var/log/supervisor/postgres-err.log
stderr_logfile_maxbytes=5MB

; ── Node.js API backend ───────────────────────────────────────────────────────
[program:backend]
command=node /app/backend/dist/index.js
user=eventagg
autostart=true
autorestart=true
priority=30
startsecs=5
startretries=5
stdout_logfile=/var/log/supervisor/backend.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/backend-err.log
stderr_logfile_maxbytes=10MB

; ── nginx ─────────────────────────────────────────────────────────────────────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=40
startsecs=3
stdout_logfile=/var/log/supervisor/nginx.log
stdout_logfile_maxbytes=5MB
stderr_logfile=/var/log/supervisor/nginx-err.log
stderr_logfile_maxbytes=5MB
