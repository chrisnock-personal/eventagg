server {
    listen 8080;
    server_name _;

    root /app/frontend/dist;
    index index.html;

    # Matches the 1gb limit set on the backend's restore route
    # (express.text({ limit: '1gb' }) in src/app.ts) — nginx's default of 1MB
    # otherwise rejects any real database dump with 413 before it reaches the
    # backend at all. Buffered entirely in memory on the backend side, so
    # this isn't unlimited, but comfortably covers realistic dump sizes.
    client_max_body_size 1024M;

    # ── Health check ──────────────────────────────────────────────────────────
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ── API proxy → Node.js backend (same container) ──────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 1800s to comfortably cover the backend's own 1800s psql restore
        # timeout (routes/admin.ts) — a shorter value was cutting off large
        # restores at the nginx layer even while the backend kept working.
        proxy_read_timeout 1800s;
        proxy_connect_timeout 5s;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "strict-origin"  always;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
