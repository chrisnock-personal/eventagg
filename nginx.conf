# Rendered by entrypoint.sh at every start: __HTTP_PORT__ / __HTTPS_PORT__
# come from HTTP_PORT (default 8080) and HTTPS_PORT (default 8443). The
# certificate is managed by tls.sh (self-signed on first start, or uploaded
# in Settings -> TLS).

# ── Plain HTTP: redirect only ─────────────────────────────────────────────────
server {
    listen __HTTP_PORT__;
    server_name _;

    # Unauthenticated liveness probe, kept on HTTP for simple monitors.
    location = /health {
        proxy_pass         http://127.0.0.1:3001/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
    }

    # 308, not 301: keeps the method and body, so an HTTP ingest POST is
    # redirected rather than turned into a GET. ($host has no port.)
    location / {
        return 308 https://$host:__HTTPS_PORT__$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    # "ssl http2" on the listen line, not "http2 on;": the default base image
    # (Ubuntu 22.04) has nginx 1.18; newer nginx only warns about this form.
    listen __HTTPS_PORT__ ssl http2;
    server_name _;

    ssl_certificate     /app/certs/server.crt;
    ssl_certificate_key /app/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /app/frontend/dist;
    index index.html;

    # Matches the 1gb limit set on the backend's restore route
    # (express.text({ limit: '1gb' }) in src/app.ts) -nginx's default of 1MB
    # otherwise rejects any real database dump with 413 before it reaches the
    # backend at all. Buffered entirely in memory on the backend side, so
    # this isn't unlimited, but comfortably covers realistic dump sizes.
    client_max_body_size 1024M;

    # ── Health check ──────────────────────────────────────────────────────────
    # Proxied to the backend's own /health (which checks the database), so a
    # remote check sees the real state: the backend itself listens on
    # 127.0.0.1:3001 only (BIND_ADDRESS).
    location = /health {
        proxy_pass         http://127.0.0.1:3001/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
    }

    # ── API proxy → Node.js backend (same container) ──────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 1800s to comfortably cover the backend's own 1800s psql restore
        # timeout (routes/admin.ts) -a shorter value was cutting off large
        # restores at the nginx layer even while the backend kept working.
        proxy_read_timeout 1800s;
        proxy_connect_timeout 5s;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "strict-origin"  always;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
